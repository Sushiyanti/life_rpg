name: Windows v1.0.1 release validation

on:
  workflow_dispatch:
  push:
    branches:
      - release/windows-v1.0.1

permissions:
  contents: read

env:
  INSTALLER_ARTIFACT: life-rpg-windows-v1.0.1-installer

jobs:
  build-windows:
    name: Build Windows installer once
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/windows-v1.0.1
          fetch-depth: 0

      - name: Record Windows and toolchain versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "Windows: $([System.Environment]::OSVersion.VersionString)" | Out-File release-build-environment.txt -Encoding utf8
          "Architecture: $env:PROCESSOR_ARCHITECTURE" | Add-Content release-build-environment.txt
          "Build: $((Get-CimInstance Win32_OperatingSystem).BuildNumber)" | Add-Content release-build-environment.txt
          "WebView2: $((Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv)" | Add-Content release-build-environment.txt
          node --version | Add-Content release-build-environment.txt
          npm --version | Add-Content release-build-environment.txt
          rustc --version --verbose | Add-Content release-build-environment.txt
          cargo --version | Add-Content release-build-environment.txt
          rustup show active-toolchain | Add-Content release-build-environment.txt

      - name: Install Rust MSVC target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Record installed Tauri CLI version
        run: npx tauri --version

      - name: Run frontend tests and typecheck
        run: |
          npm test -- --run
          npm run typecheck

      - name: Run frontend audit
        shell: pwsh
        run: |
          npm audit --json > npm-audit.json
          if ($LASTEXITCODE -ne 0) { Write-Host 'npm audit reported vulnerabilities; preserving the report for review.' }
          exit 0

      - name: Run Rust formatting, tests, and checks
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo check --workspace

      - name: Build Windows x64 NSIS installer once
        run: npm run build -- --bundles nsis

      - name: Create installer checksum manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File SHA256SUMS -Encoding ascii
          "INSTALLER=$($installer.Name)" | Out-File release-installer-metadata.txt -Encoding utf8
          "SIZE_BYTES=$($installer.Length)" | Add-Content release-installer-metadata.txt
          "SHA256=$hash" | Add-Content release-installer-metadata.txt
          Get-Content SHA256SUMS
          Get-Content release-installer-metadata.txt

      - name: Upload reusable installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-rpg-windows-v1.0.1-installer
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            SHA256SUMS
            release-installer-metadata.txt
            release-build-environment.txt
            npm-audit.json

  basic-installed-smoke:
    name: Basic installed smoke
    needs: build-windows
    if: needs.build-windows.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/windows-v1.0.1
          fetch-depth: 1
      - name: Download reusable installer
        uses: actions/download-artifact@v4
        with:
          name: life-rpg-windows-v1.0.1-installer
          path: installer
      - name: Install launch close relaunch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem installer -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Reusable installer artifact is missing.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Life RPG basic smoke'
          $dataDir = Join-Path $env:APPDATA 'com.liferpg.desktop'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          $setup = Start-Process $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $app = Get-ChildItem $installDir -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*uninstall*' } | Select-Object -First 1
          if (-not $app) { throw 'Installed executable not found.' }
          $first = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($first.HasExited) { throw "Application exited on first launch: $($first.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(20)
          while (-not (Test-Path (Join-Path $dataDir 'life-rpg.sqlite3')) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path (Join-Path $dataDir 'life-rpg.sqlite3'))) { throw 'SQLite database was not initialized.' }
          Stop-Process -Id $first.Id -Force
          Start-Sleep -Seconds 2
          $second = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($second.HasExited) { throw "Application exited after relaunch: $($second.ExitCode)" }
          'BASIC_INSTALLED_SMOKE=PASS' | Out-File basic-smoke-evidence.txt -Encoding utf8
          Stop-Process -Id $second.Id -Force

      - name: Upload basic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-basic-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: basic-smoke-evidence.txt

  webview2-diagnostic:
    name: WebView2 diagnostic
    needs: build-windows
    if: needs.build-windows.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/windows-v1.0.1
          fetch-depth: 1
      - name: Download reusable installer
        uses: actions/download-artifact@v4
        with:
          name: life-rpg-windows-v1.0.1-installer
          path: installer
      - name: Install and run WebView2 diagnostic only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem installer -Recurse -Filter '*.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Life RPG WebView2 diagnostic'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $setup = Start-Process $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $app = Get-ChildItem $installDir -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*uninstall*' } | Select-Object -First 1
          if (-not $app) { throw 'Installed executable not found.' }
          try {
            $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'Life RPG WebView2 diagnostic data'
            if (Test-Path $env:WEBVIEW2_USER_DATA_FOLDER) { Remove-Item $env:WEBVIEW2_USER_DATA_FOLDER -Recurse -Force }
            & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows-webview2-diagnostic.ps1 -AppPath $app.FullName -Port 9222 -TimeoutSeconds 30 2>&1 | Tee-Object webview2-diagnostic.log
            if ($LASTEXITCODE -ne 0) { throw 'CDP diagnostic failed.' }
          } finally {
            Get-Process -Name ([System.IO.Path]::GetFileNameWithoutExtension($app.Name)) -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Name $app.Name -ErrorAction SilentlyContinue
            Remove-Item 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Name $app.Name -ErrorAction SilentlyContinue
            Remove-Item 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload WebView2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-webview2-diagnostic-${{ github.run_id }}
          if-no-files-found: warn
          path: webview2-diagnostic.log

  ui-product-validation:
    name: UI and product validation
    needs: [build-windows, webview2-diagnostic]
    if: needs.build-windows.result == 'success' && needs.webview2-diagnostic.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/windows-v1.0.1
          fetch-depth: 1
      - name: Download reusable installer
        uses: actions/download-artifact@v4
        with:
          name: life-rpg-windows-v1.0.1-installer
          path: installer
      - name: Install and run bounded real UI harness
        shell: pwsh
        env:
          WEBVIEW2_DEBUG_PORT: 9222
          EVIDENCE_DIR: windows-evidence
          DIALOG_SCRIPT: scripts/windows-dialog.ps1
          BACKUP_PATH: windows-evidence/backup with spaces 测试.liferpg-backup
          MALFORMED_PATH: windows-evidence/malformed backup 测试.liferpg-backup
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem installer -Recurse -Filter '*.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Life RPG UI validation'
          $dataDir = Join-Path $env:APPDATA 'com.liferpg.desktop'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'windows-evidence') | Out-Null
          $setup = Start-Process $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $app = Get-ChildItem $installDir -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*uninstall*' } | Select-Object -First 1
          if (-not $app) { throw 'Installed executable not found.' }
          try {
            $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'Life RPG UI WebView2 data'
            if (Test-Path $env:WEBVIEW2_USER_DATA_FOLDER) { Remove-Item $env:WEBVIEW2_USER_DATA_FOLDER -Recurse -Force }
            & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows-webview2-diagnostic.ps1 -AppPath $app.FullName -Port 9222 -TimeoutSeconds 30 *> webview2-ui-launch.log
            if ($LASTEXITCODE -ne 0) { throw 'CDP preflight failed; UI harness was not run.' }
            npm install --no-save --ignore-scripts playwright-core@1.55.0
            node scripts/windows-release-ui.mjs *> ui-product-validation.log
            if ($LASTEXITCODE -ne 0) { throw 'UI/product validation failed.' }
          } finally {
            Get-Process -Name ([System.IO.Path]::GetFileNameWithoutExtension($app.Name)) -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Name $app.Name -ErrorAction SilentlyContinue
            Remove-Item 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Name $app.Name -ErrorAction SilentlyContinue
            Remove-Item 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload UI/product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-product-validation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ui-product-validation.log
            webview2-ui-launch.log
            windows-evidence/**

  durability-reinstall:
    name: Durability and reinstall
    needs: build-windows
    if: needs.build-windows.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/windows-v1.0.1
          fetch-depth: 1
      - name: Download reusable installer
        uses: actions/download-artifact@v4
        with:
          name: life-rpg-windows-v1.0.1-installer
          path: installer
      - name: Run bounded durability and reinstall checks
        shell: pwsh
        env:
          WEBVIEW2_DEBUG_PORT: 9223
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem installer -Recurse -Filter '*.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Life RPG durability'
          $dataDir = Join-Path $env:APPDATA 'com.liferpg.desktop'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          $setup = Start-Process $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $app = Get-ChildItem $installDir -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*uninstall*' } | Select-Object -First 1
          if (-not $app) { throw 'Installed executable not found.' }
          $first = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($first.HasExited) { throw 'Initial durability launch exited.' }
          $deadline = (Get-Date).AddSeconds(20)
          while (-not (Test-Path (Join-Path $dataDir 'life-rpg.sqlite3')) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path (Join-Path $dataDir 'life-rpg.sqlite3'))) { throw 'SQLite database was not initialized.' }
          Stop-Process -Id $first.Id -Force
          Start-Sleep -Seconds 2
          $second = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($second.HasExited) { throw 'Restart after abrupt termination exited.' }
          Stop-Process -Id $second.Id -Force
          $uninstaller = Get-ChildItem $installDir -Recurse -File -Filter '*uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller was not found.' }
          $remove = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall failed: $($remove.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $app.FullName) { throw 'Application executable remains after uninstall.' }
          $reinstall = Start-Process $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw "Reinstall failed: $($reinstall.ExitCode)" }
          $again = Get-ChildItem $installDir -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*uninstall*' } | Select-Object -First 1
          if (-not $again) { throw 'Executable missing after reinstall.' }
          $launched = Start-Process $again.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($launched.HasExited) { throw 'Application exited after reinstall.' }
          if (-not (Test-Path (Join-Path $dataDir 'life-rpg.sqlite3'))) { throw 'SQLite database was not retained after reinstall.' }
          'DURABILITY_ABRUPT_RESTART=PASS' | Out-File durability-reinstall-evidence.txt -Encoding utf8
          'UNINSTALL=PASS' | Add-Content durability-reinstall-evidence.txt
          'REINSTALL_PERSISTENCE=PASS' | Add-Content durability-reinstall-evidence.txt
          Stop-Process -Id $launched.Id -Force
      - name: Upload durability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-durability-reinstall-${{ github.run_id }}
          if-no-files-found: warn
          path: durability-reinstall-evidence.txt
