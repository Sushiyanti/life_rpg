name: Windows v1.0.1-beta.1 build

on:
  workflow_dispatch:
  push:
    branches:
      - beta/v1.0.1-beta.1

permissions:
  contents: read

jobs:
  windows-beta:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v4
        with:
          ref: beta/v1.0.1-beta.1
          fetch-depth: 0

      - name: Record build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "Windows: $([System.Environment]::OSVersion.VersionString)" | Out-File beta-build-environment.txt -Encoding utf8
          "Architecture: $env:PROCESSOR_ARCHITECTURE" | Add-Content beta-build-environment.txt
          "Build: $((Get-CimInstance Win32_OperatingSystem).BuildNumber)" | Add-Content beta-build-environment.txt
          "WebView2: $((Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv)" | Add-Content beta-build-environment.txt
          node --version | Add-Content beta-build-environment.txt
          npm --version | Add-Content beta-build-environment.txt
          rustc --version --verbose | Add-Content beta-build-environment.txt
          cargo --version | Add-Content beta-build-environment.txt
          rustup show active-toolchain | Add-Content beta-build-environment.txt

      - name: Install Rust MSVC target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lightweight frontend checks
        run: |
          npm test -- --run
          npm run typecheck

      - name: Run lightweight Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo check --workspace

      - name: Build Windows x64 NSIS beta installer
        run: npm run build -- --bundles nsis

      - name: Create beta checksum and metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File SHA256SUMS -Encoding ascii
          "BRANCH=beta/v1.0.1-beta.1" | Out-File beta-build-metadata.txt -Encoding utf8
          "COMMIT=$env:GITHUB_SHA" | Add-Content beta-build-metadata.txt
          "INSTALLER=$($installer.Name)" | Add-Content beta-build-metadata.txt
          "SIZE_BYTES=$($installer.Length)" | Add-Content beta-build-metadata.txt
          "SHA256=$hash" | Add-Content beta-build-metadata.txt
          Get-Content SHA256SUMS
          Get-Content beta-build-metadata.txt

      - name: Upload private beta installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-rpg-windows-v1.0.1-beta.1
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            SHA256SUMS
            beta-build-metadata.txt
            beta-build-environment.txt
